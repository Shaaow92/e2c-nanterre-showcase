<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retroplanning - E2C Nanterre</title>
<link rel="stylesheet" href="style.css" />
<style>
.wrap{padding:8rem 0 3rem;position:relative;z-index:2}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:1.4rem;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid #cbd5e1;border-radius:16px;padding:1.2rem;color:#0f172a}
body.dark-mode .box{background:#0f172a;color:#f8fafc;border-color:#334155}
table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
table.cal th{padding:.5rem;border-bottom:2px solid #cbd5e1;font-size:.8rem}
table.cal td{height:82px;vertical-align:top;border:1px solid #e2e8f0;padding:.35rem}
body.dark-mode table.cal td{border-color:#1e293b}
.ev{display:block;width:100%;margin-top:.25rem;padding:.22rem .35rem;border:0;border-radius:6px;font-size:.7rem;font-weight:700;text-align:left;cursor:pointer}
.ev.visite{background:#ffedd5;color:#9a3412}
.ev.job{background:#ede9fe;color:#5b21b6}
.ev.coaching{background:#e0f2fe;color:#075985}
.pbtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.pbtn{padding:.55rem .8rem;border-radius:10px;border:1px solid #94a3b8;background:#f8fafc;color:#0f172a;font-weight:700;cursor:pointer}
.pbtn.on[data-k="visite"]{background:#ea580c;color:#fff;border-color:#ea580c}
.pbtn.on[data-k="job"]{background:#7c3aed;color:#fff;border-color:#7c3aed}
.pbtn.on[data-k="coaching"]{background:#0284c7;color:#fff;border-color:#0284c7}
.task{border:1px solid #e2e8f0;border-radius:10px;padding:.7rem;margin-top:.6rem}
body.dark-mode .task{border-color:#334155}
.st{float:right;border:0;border-radius:999px;padding:.18rem .55rem;font-size:.72rem;font-weight:800;cursor:pointer}
.s-todo{background:#ffedd5;color:#9a3412}
.s-wip{background:#fef9c3;color:#854d0e}
.s-done{background:#dcfce7;color:#166534}
</style></head><body>
<header class="navbar" id="navbar"><div class="container nav-container">
<a href="index.html" class="brand"><strong>E2C92</strong> <small>Nanterre</small></a>
<nav class="nav-links">
<a href="index.html" class="nav-item">Accueil</a>
<a href="actualites.html" class="nav-item">Actualites</a>
<a href="tu-hesites.html" class="nav-item">Tu hesites ?</a>
<a href="retroplanning.html" class="nav-item" style="color:#ea580c;font-weight:700">Retroplanning</a>
</nav>
<button class="theme-toggle" id="theme-toggle" aria-label="Theme">Lune/Soleil</button>
</div></header>
<main class="container wrap">
<h1>Retroplanning - Decembre 2026</h1>
<p>3 projets sans chevauchement de dates : Visite entreprise (1-7 dec.), Job dating (9-15 dec.), Coaching (17-22 dec.).</p>
<div class="grid2">
<div class="box"><h2>Calendrier Decembre 2026</h2><table class="cal"><thead><tr><th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th><th>Dim</th></tr></thead><tbody id="cbody"></tbody></table></div>
<div class="box"><div class="pbtns" id="pbtns">
<button type="button" class="pbtn on" data-k="visite">Visite entreprise</button>
<button type="button" class="pbtn" data-k="job">Job dating</button>
<button type="button" class="pbtn" data-k="coaching">Coaching</button>
</div><div id="pinfo"></div><div id="ptasks"></div></div>
</div></main>
<script>
var PROJ = {
  visite: { titre: "Visite entreprise", date: "7 decembre", plage: "1er au 7 decembre", days: {1:"Confirmer date",3:"Liste groupe",5:"Infos RDV",7:"Visite entreprise"}, taches: [
    {d:"7 dec.",t:"Visite de l entreprise",r:"Formateur",s:"A faire"},
    {d:"5 dec.",t:"Envoyer heure, lieu et consignes",r:"Equipe",s:"A faire"},
    {d:"3 dec.",t:"Constituer le groupe",r:"Formateur",s:"En cours"},
    {d:"1er dec.",t:"Confirmer la date avec l entreprise",r:"Partenaires",s:"Fait"}
  ]},
  job: { titre: "Job dating", date: "15 decembre", plage: "9 au 15 decembre", days: {9:"Valider postes",11:"CV et groupe",13:"Rappel jeunes",15:"Job dating"}, taches: [
    {d:"15 dec.",t:"Job dating et entretiens",r:"Equipe",s:"A faire"},
    {d:"13 dec.",t:"Transmettre horaires et consignes",r:"Formateur",s:"A faire"},
    {d:"11 dec.",t:"Verifier CV et constituer le groupe",r:"Conseiller",s:"En cours"},
    {d:"9 dec.",t:"Confirmer date avec recruteurs",r:"Partenaires",s:"Fait"}
  ]},
  coaching: { titre: "Coaching", date: "22 decembre", plage: "17 au 22 decembre", days: {17:"Cadre seance",18:"Besoins jeunes",20:"Convocation",22:"Coaching"}, taches: [
    {d:"22 dec.",t:"Seance de coaching",r:"Coach",s:"A faire"},
    {d:"20 dec.",t:"Envoyer heure et lieu aux jeunes",r:"Equipe",s:"A faire"},
    {d:"18 dec.",t:"Lister les participants et besoins",r:"Formateur",s:"En cours"},
    {d:"17 dec.",t:"Valider la date et la salle",r:"Coach",s:"Fait"}
  ]}
};
var cur = "visite"; var ord = ["A faire","En cours","Fait"];
function cls(s){return s==="Fait"?"s-done":(s==="En cours"?"s-wip":"s-todo");}
function drawCal(){
  var tb=document.getElementById("cbody"); var d=1, out="";
  for(var r=0;r<6;r++){ var tr="";
    for(var c=0;c<7;c++){
      if((r===0 && c<1) || d>31){tr+="<td></td>";}else{
        var ev=""; ["visite","job","coaching"].forEach(function(k){if(PROJ[k].days[d]) ev+="<button type=button class='ev "+k+"' onclick='pick(""+k+"")'>"+PROJ[k].days[d]+"</button>";});
        tr+="<td><strong>"+d+"</strong>"+ev+"</td>"; d++;
      }
    }
    out+="<tr>"+tr+"</tr>"; if(d>31) break;
  }
  tb.innerHTML=out;
}
function drawSide(){
  var p=PROJ[cur];
  document.getElementById("pinfo").innerHTML="<h3>"+p.titre+"</h3><p>Echeance : <strong>"+p.date+"</strong> ("+p.plage+")</p>";
  var h="";
  p.taches.forEach(function(x,i){
    h+="<div class='task'><button type=button class='st "+cls(x.s)+"' onclick='toggleSt("+i+")'>"+x.s+"</button><strong>"+x.d+"</strong><div>"+x.t+"</div><small>Responsable : "+x.r+"</small></div>";
  });
  document.getElementById("ptasks").innerHTML=h;
}
window.pick=function(k){cur=k; document.querySelectorAll(".pbtn").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-k")===k);}); drawSide();};
window.toggleSt=function(i){var t=PROJ[cur].taches[i]; t.s=ord[(ord.indexOf(t.s)+1)%3]; drawSide();};
document.querySelectorAll(".pbtn").forEach(function(b){b.addEventListener("click",function(){pick(this.getAttribute("data-k"));});});
drawCal(); drawSide();
</script><script src="app.js" defer></script></body></html>
